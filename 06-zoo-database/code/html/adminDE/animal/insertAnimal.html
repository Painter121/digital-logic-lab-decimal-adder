<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Animal Data</title>
    <link rel="stylesheet" href="../../../css/adminDE/animal/insertAnimal.css">
</head>
<body>
    <div class="container">
    <h1>Insert New Animal Details</h1>
    <form id="animalForm" class="details-card" enctype="multipart/form-data">
        
        <div class="box2">
            <div class="form-group-1">
                <label for="species">Species</label>
                <input type="text" id="species" name="species" required>
            </div>
            <div class="form-group-2">
                <label for="subspecies">Subspecies</label>
                <input type="text" id="subspecies" name="subspecies" required>
            </div>
        </div>

        <div class="box2">
            <div class="form-group-1">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" required>
            </div>
            <div class="form-group-2">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
        </div>
        <div class="box2">
            <div class="form-group-1">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
            <div class="form-group-2">
                <label for="origin">Origin</label>
                <input type="text" id="origin" name="origin" required>
            </div>
        </div>
        <div class="form-group">
            <label for="details">Details</label>
            <textarea id="details" name="details" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label for="image">Image</label>
            <div class="image-upload-container">
                <button type="button" id="addImageBtn" class="add-image-btn">Add Image</button>
                <input type="file" id="image" name="image" accept="image/*"  style="display: none;">
                <p id="imagePrompt">Click to add image</p>
                <p id="imagePrompt" style="text-decoration:underline;">JPEG or PNG</p>
            </div>
            <div id="imagePreviewContainer" style="display: none;">
                <img id="imagePreview" src="" alt="Animal Image">
            </div>
        </div>
        
        <div class="category-form-group">
            <label for="categoryID">Category</label>
            <input type="text" id="categoryID" name="categoryID" readonly required disabled>
            <button type="button" id="selectCategoryBtn">Select Category</button>
        </div>
        
        <!-- Modal for Category Selection -->
        <div id="categoryModal" class="category-modal">
            <div class="category-modal-content">
                <span class="category-close">&times;</span>
                <h3>Select Category</h3>
                <div id="categoryList" class="category-list"></div>
            </div>
        </div>
        <div class="form-group">
            <label for="zoneID">ZoneName</label>
            <input type="text" id="zoneID" name="zoneID" readonly required disabled>
            <button type="button" id="selectZoneBtn">Select Zone</button>
        </div>

        <!-- Modal for Zone Selection -->
        <div id="zoneModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Select Zone</h3>
                <div id="zoneList" class="zone-list"></div>
            </div>
        </div>
        <button type="submit">Add Animal</button>
    </form>
    
</div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../../js/adminDE/animal/insertAnimal.js" defer></script>
</body>
</html>
