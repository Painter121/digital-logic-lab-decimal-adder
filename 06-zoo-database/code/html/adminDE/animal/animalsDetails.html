<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../../css/adminDE/animal/animalsDetails.css">
</head>
<body>
    <div class="container">
        <div class="animalDetails">
            <div class="box">
                <div class="title">
                    
                    <h1><i class="fa-solid fa-crow"></i> Animal List</h1>

                    <div class="searchBar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <div class="resultCount" style="margin-right: 10px; font-size: 20px; color: #248132;"></div>                   
                        <input type="search" placeholder="Search by Animal ID, Species, Nickname, Zone">
                    </div>
                </div> 
                <table id="animalTable" >
                    <thead>
                        <tr>
                            <th>Animal ID</th>
                            <th>Species</th>
                            <th>Nickname</th>
                            <th>Gender</th>
                            <th>Zone</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- data -->
                    </tbody>
                </table>
                <div class="pagination">
                    <button id="prevPage" disabled>Previous</button>
                    <div id="pageNumbers" class="page-numbers"></div>
                    <button id="nextPage">Next</button>
                </div>
                
            </div>
        </div>
        
        <!-- <button class="fixed-button" onclick="goToInsert()"><i class="fa-solid fa-plus"></i></button> -->
        <button class="fixed-button" onclick="goToInsert()">
            <div class="sign">+</div>
            <div class="text">Insert</div>
        </button>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../../../js/adminDE/animal/animalsDetails.js" defer></script>
</html>
