<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee Details</title>
    <link rel="stylesheet" href="../../../css/adminDE/employee/viewEmployee.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <h1>Edit Employee Details</h1>
        <form id="employeeForm" class="details-card" onsubmit="confirmUpdate(event)">
            <div class="form-group">
                <label for="employeeID">Employee ID</label>
                <input type="text" id="employeeID" name="employeeID" disabled>
            </div>

            <div class="box2">
                <div class="form-group-1">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group-2">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>

            <div class="box2">
                <div class="form-group-1">
                    <label for="position">Position</label>
                    <input type="text" id="position" name="position" required>
                </div>
    
                <div class="form-group-2">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" required style="resize: vertical;"></textarea>
            </div>

            <div class="box2">
                <div class="form-group-1">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
    
                <div class="form-group-2">
                    <label for="nationality">Nationality</label>
                    <input type="text" id="nationality" name="nationality" required>
                </div>
            </div>

            <div class="form-group">
                <label for="zoneID">Zone:</label>
                <input type="text" id="zoneID" name="zoneID" readonly required disabled>
                <button type="button" id="selectZoneBtn">Select Zone</button>
            </div>
            
            <!-- Modal for Zone Selection -->
            <div id="zoneModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h3>Select Zone</h3>
                    <div id="zoneList" class="zone-list"></div>
                </div>
            </div>

            <div class="form-groupBt">
                <button type="submit">Save Changes</button>
            </div>

            <div class="form-groupBt">
                <button class="Delbutton" type="button" id="delete"  data-tooltip="Delete Employee">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </form>

        <div id="overlay" class="overlay-hidden"></div>

        <div class="confirmBox" id="confirmBox">
            <h2>Are you sure?</h2>
            <p>Are you sure you want to delete this item?</p>
            <p id="secP">The data will not be recoverable.</p>
            <div class="confirmButtons">
                <button class="btn confirm" onclick="confirmDelete()">Confirm</button>
                <button class="btn cancel" onclick="cancelDelete()">Cancel</button>
            </div>
        </div>
        <div style="text-align: center; display: flex; align-items: center; justify-content: center;">
            <a href="javascript:history.back()" style="
                display: inline-block; 
                padding: 10px 15px; 
                background-color: #3992f0; 
                color: white; 
                text-decoration: none; 
                border-radius: 5px; 
                font-weight: bold;
                transition: background-color 0.3s;
                margin-top: 20px;">
                Back
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../../js/adminDE/employee/viewEmployee.js" defer></script>
</body>
</html>
