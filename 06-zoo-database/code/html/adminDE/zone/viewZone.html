<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Zone Details</title>
    <link rel="stylesheet" href="../../../css/adminDE/zone/viewZone.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div class="container">
        <h1>Edit Zone Details</h1>
        <form id="zoneForm" class="details-card" onsubmit="confirmUpdate(event)">

            <div class="form-group">
                <label for="zoneID">Zone ID</label>
                <input type="text" id="zoneID" name="zoneID" readonly disabled>
            </div>

            <div class="form-group">
                <label for="zoneName">Zone Name</label>
                <input type="text" id="zoneName" name="zoneName" required>
            </div>

            <div class="box2">
                <div class="form-group-1">
                    <label for="employeeCapacity">Employee Capacity</label>
                    <input type="number" id="employeeCapacity" name="employeeCapacity" required>
                </div>

                <div class="form-group-2">
                    <label for="animalCapacity">Animal Capacity</label>
                    <input type="number" id="animalCapacity" name="animalCapacity" required>
                </div>
            </div>

            <div class="form-group">
                <button type="submit">Save Changes</button>
            </div>
            <div class="form-group">
                <button type="button" id="delete" data-tooltip="Delete Zone">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </form>
        <div style="text-align: center; display: flex; align-items: center; justify-content: center;">
            <a href="javascript:history.back()" style="
                display: inline-block; 
                padding: 10px 15px; 
                background-color: #3992f0; 
                color: white; 
                text-decoration: none; 
                border-radius: 5px; 
                font-weight: bold;
                transition: background-color 0.3s;">
                Back
            </a>
        </div>
        

        <div id="overlay" class="overlay-hidden"></div>
        <div class="confirmBox" id="confirmBox">
            <h2>Are you sure?</h2>
            <p>Are you sure you want to delete this item?</p>
            <p id="secP">The data will not be recoverable.</p>
            <div class="confirmButtons">
                <button class="btn confirm" onclick="confirmDelete()">Confirm</button>
                <button class="btn cancel" onclick="cancelDelete()">Cancel</button>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../../js/adminDE/zone/viewZone.js" defer></script>
</body>

</html>
