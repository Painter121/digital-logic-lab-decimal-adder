<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/UserRegister.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div class="container">
        <div class="menu">
            <div class="logo">
                <a href="Home.html"><i class="fa-solid fa-hippo"></i></a>
            </div>
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="UserDE/animallist.html">Animals</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Contact.html">Contact</a></li>
                <li><a href="Login.html">Login</a></li>
            </ul>

        </div>

        <div class="otp-section">
            <div class="boxInput">
                <h2>กรอกอีเมลเพื่อรับ OTP</h2>
                <form id="otpForm">
                    <input type="email" id="email" placeholder="กรุณากรอกอีเมล" required>
                    <button type="submit" class="submit-btn" id="bt-OTP">ส่ง OTP</button>
                    <!-- <a href="register.html">test</a> -->
                </form>
            </div>

            <!-- otp-container สำหรับแสดง OTP และเวลา -->
            <div id="otp-box-container" style="display: none;">
                <div class="timer" id="timer">OTP หมดอายุใน: 03:00</div>
            </div>

            <div id="otp-input-container" style="display:none;">
                <label for="otp">กรอก OTP ที่ได้รับ</label>
                <div id="otp-fields" style="display:flex; gap:5px;">
                    <div class="boxOtp">
                        <input type="text" maxlength="1" id="OTP-Digit-1" class="otp-field" required>
                        <input type="text" maxlength="1" id="OTP-Digit-2" class="otp-field" required>
                        <input type="text" maxlength="1" id="OTP-Digit-3" class="otp-field" required>
                        <input type="text" maxlength="1" id="OTP-Digit-4" class="otp-field" required>
                        <input type="text" maxlength="1" id="OTP-Digit-5" class="otp-field" required>
                        <input type="text" maxlength="1" id="OTP-Digit-6" class="otp-field" required>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <button id="verify-otp" onclick="GroupOTP()">ยืนยัน OTP</button>
                    <a href="UserRegister.html" style="margin-top: 10px;">เปลี่ยน Email</a>
                </div>
            </div>
        </div>

        <div id="loading-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
                <p>กำลังโหลด...</p>
                <div class="spinner" style="margin-top: 10px; border: 5px solid #f3f3f3; border-top: 5px solid #0c691f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;  margin-left: auto; margin-right: auto;"></div>
            </div>
        </div>
        
        <!-- Animation สำหรับ Spinner -->
        <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        </style>
        



</body>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="../js/UserRegister.js"></script>

</html>
