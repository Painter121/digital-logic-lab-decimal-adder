<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Animal Data</title>
    <link rel="stylesheet" href="../../../css/adminDE/animal/viewData.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <h1>Edit Animal Details</h1>
        <form id="animalForm" class="details-card">
            <div class="form-group">
                <img id="imagePreview" src="" alt="Animal Image" style="max-width: 100%; max-height: 300px; margin-bottom: 10px;">
                <input type="file" id="image" name="image" accept="image/*">
            </div>
            <div class="form-group">
                <label for="animalID">Animal ID</label>
                <input type="text" id="animalID" name="animalID" readonly disabled>
            </div>
           
            <div class="box2">
                <div class="form-group-1">
                    <label for="species">Species</label>
                    <input type="text" id="species" name="species" required>
                </div>
                <div class="form-group-2">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" required>
                </div>
            </div>

            <div class="box2">
                <div class="form-group-1">
                    <label for="subspecies">Subspecies</label>
                    <input type="text" id="subspecies" name="subspecies" required>
                </div>
                <div class="form-group-2">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="Male" >Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
            
            <div class="box2">
                <div class="form-group-1">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                </div>
                <div class="form-group-2">
                    <label for="origin">Origin</label>
                    <input type="text" id="origin" name="origin" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="details">Details</label>
                <textarea id="details" name="details" rows="4" required></textarea>
            </div>
            
            <div class="category-form-group">
                <label for="categoryID">Category</label>
                <input type="text" id="categoryID" name="categoryID" readonly required disabled>
                <button type="button" id="selectCategoryBtn">Select Category</button>
            </div>
            
            <!-- Modal for Category Selection -->
            <div id="categoryModal" class="category-modal">
                <div class="category-modal-content">
                    <span class="category-close">&times;</span>
                    <h3>Select Category</h3>
                    <div id="categoryList" class="category-list"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="zoneID">ZoneName</label>
                <input type="text" id="zoneID" name="zoneID" readonly required disabled>
                <button type="button" id="selectZoneBtn">Select Zone</button>
            </div>
    
            <!-- Modal for Zone Selection -->
            <div id="zoneModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h3>Select Zone</h3>
                    <div id="zoneList" class="zone-list"></div>
                </div>
            </div>

            <div class="bt">
                <button type="submit">Save Changes</button>
                <button type="button" id="delete" onclick="deleteData()" data-tooltip="Delete Animal">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </form>

        <div id="overlay" class="overlay-hidden"></div>
        <div class="confirmBox" id="confirmBox">
            <h2>Are you sure?</h2>
            <p>Are you sure you want to delete this item?</p>
            <p id="secP">The data will not be recoverable.</p>
            <div class="confirmButtons">
                <button class="btn confirm" onclick="confirmDelete()">Confirm</button>
                <button class="btn cancel" onclick="cancelDelete()">Cancel</button>
            </div>
        </div>
        <div style="text-align: center; display: flex; align-items: center; justify-content: center;">
            <a href="javascript:history.back()" style="
                display: inline-block; 
                padding: 10px 15px; 
                background-color: #3992f0; 
                color: white; 
                text-decoration: none; 
                border-radius: 5px; 
                font-weight: bold;
                transition: background-color 0.3s;
                margin-top: 30px;">
                Back
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../../js/adminDE/animal/viewData.js" defer></script>
</body>
</html>
