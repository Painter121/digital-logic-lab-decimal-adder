<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../../css/adminDE/zone/zoneDetail.css">
</head>
<body>
    <div class="container">
        <div class="zoneDetails">
            <div class="box">
                <div class="title">
                    
                    <h1><i class="fa-solid fa-map"></i> Zone List</h1>

                    <div class="searchBar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <div class="resultCount" style="margin-right: 10px; font-size: 20px; color: #248132;"></div>                   
                        <input type="search" placeholder="Search by Zone ID or Zone Name">
                    </div>
                </div> 
                <table id="zoneTable" >
                    <thead>
                        <tr>
                            <th>Zone ID</th>
                            <th>ZoneName</th>
                            <th>Capacity</th>
                            <th>Remaining Animal Capacity</th>
                            <th>Remaining Employee Capacity</th>
                            <th>Detail</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- data -->
                    </tbody>
                </table>
                <div class="pagination">
                    <button id="prevPage" disabled>Previous</button>
                    <div id="pageNumbers" class="page-numbers"></div>
                    <button id="nextPage">Next</button>
                </div>
            </div>
        </div>
        
        
        <!-- <button class="fixed-button" onclick="goToInsert()"><i class="fa-solid fa-plus"></i></button> -->
        <button class="fixed-button" onclick="goToInsert()">
            <div class="sign">+</div>
            <div class="text">Insert</div>
        </button>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="notification" class="notification">
        <h1 id="Notification">Red-Zone Detected!</h1>
        <p id="text121">Please assign employees to the red zones to take care of the animals or move animals out of the zone.</p><br>
        <button onclick="closeNotification()">Ok</button>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../../../js/adminDE/zone/zoneDetail.js" defer></script>
</html>
